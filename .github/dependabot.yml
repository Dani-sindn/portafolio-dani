# Weekly dependency update PRs. Minor/patch bumps arrive grouped in a single PR;
# majors come one by one so they can be reviewed (and previewed on Vercel) before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
